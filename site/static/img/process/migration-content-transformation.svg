<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Documentation migration and content transformation</title>
  <desc id="desc">A four-person team discovered and tracked content, reviewed source pages, and decided what to keep, combine, restructure, or retire. The program migrated 101 product wikis and reduced 1,157 source pages to 469 destination pages.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f0fdfa"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#ccfbf1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 750; letter-spacing: 1.8px; }
      .heading { font-size: 28px; font-weight: 750; letter-spacing: -0.5px; }
      .subheading { font-size: 16px; fill: #526079; }
      .stage { font-size: 14px; font-weight: 750; letter-spacing: 1.4px; fill: #1e40af; }
      .card-title { font-size: 22px; font-weight: 750; }
      .count-label { font-size: 19px; font-weight: 750; }
      .number { font-size: 36px; font-weight: 800; fill: #1e40af; }
      .body { font-size: 16px; fill: #44516a; }
      .chip { font-size: 14px; font-weight: 750; }
      .small { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .support { font-size: 16px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#background)"/>
  <text class="eyebrow" x="40" y="50" fill="#2563eb">MIGRATIONS AND INFORMATION ARCHITECTURE</text>
  <text class="heading" x="40" y="88">Move the useful content, not every source page</text>
  <text class="subheading" x="40" y="118">Discovery, editorial decisions, and repeatable tracking reduced the page volume while preserving 101 product-wiki projects.</text>

  <path d="M287 336H340" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M850 336H903" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="170" width="247" height="330" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="350" y="170" width="500" height="330" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="913" y="170" width="247" height="330" rx="22" fill="url(#result)" stroke="#2dd4bf" stroke-width="2"/>
  </g>

  <g transform="translate(65 198)">
    <rect x="0" y="0" width="48" height="58" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="10" y="-8" width="48" height="58" rx="5" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <path d="M20 10H47M20 20H47M20 30H40" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text class="stage" x="65" y="298">SOURCE SET</text>
  <text class="number" x="65" y="346">101</text>
  <text class="count-label" x="132" y="343">product wikis</text>
  <text class="number" x="65" y="399">1,157</text>
  <text class="count-label" x="154" y="396">source pages</text>
  <text class="body" x="65" y="438">About 3–80 pages</text>
  <text class="body" x="65" y="464">in each wiki project</text>

  <rect x="374" y="196" width="452" height="66" rx="14" fill="#eff6ff"/>
  <circle cx="407" cy="229" r="19" fill="#2563eb"/><text x="407" y="235" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">1</text>
  <text class="card-title" x="440" y="222">Discover and track</text>
  <text class="body" x="440" y="247">Find content, owners, status, and page counts.</text>

  <path d="M600 270V294" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="374" y="304" width="452" height="166" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="407" cy="338" r="19" fill="#2563eb"/><text x="407" y="344" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">2</text>
  <text class="card-title" x="440" y="342">Review each source</text>
  <text class="body" x="398" y="379">Make a clear content decision before migration.</text>
  <g transform="translate(398 400)">
    <rect width="84" height="36" rx="18" fill="#dbeafe"/><text class="chip" x="42" y="24" text-anchor="middle" fill="#1e40af">KEEP</text>
    <rect x="94" width="100" height="36" rx="18" fill="#ccfbf1"/><text class="chip" x="144" y="24" text-anchor="middle" fill="#0f766e">COMBINE</text>
    <rect x="204" width="124" height="36" rx="18" fill="#fef3c7"/><text class="chip" x="266" y="24" text-anchor="middle" fill="#92400e">RESTRUCTURE</text>
    <rect x="338" width="72" height="36" rx="18" fill="#fee2e2"/><text class="chip" x="374" y="24" text-anchor="middle" fill="#991b1b">RETIRE</text>
  </g>

  <g transform="translate(938 200)">
    <path d="M0 14L42 0L84 14V66C84 86 66 101 42 112C18 101 0 86 0 66Z" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <path d="M21 58L35 72L64 40" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="stage" x="1036" y="343" fill="#0f766e" text-anchor="middle">CENTRAL KNOWLEDGE</text>
  <text class="stage" x="1036" y="365" fill="#0f766e" text-anchor="middle">HUB</text>
  <text class="number" x="938" y="415" fill="#0f766e">469</text>
  <text class="card-title" x="1010" y="412">pages</text>
  <text class="body" x="938" y="447">101 migrated projects</text>
  <text class="body" x="938" y="475">59% fewer pages</text>

  <g transform="translate(40 536)">
    <rect width="1120" height="104" rx="18" fill="#172033"/>
    <text class="small" x="24" y="31" fill="#93c5fd">PROGRAM SUPPORT</text>
    <g transform="translate(24 48)">
      <rect width="180" height="36" rx="18" fill="#26334a"/><text class="support" x="90" y="24" fill="#ffffff" text-anchor="middle">Four-person team</text>
      <rect x="200" width="190" height="36" rx="18" fill="#26334a"/><text class="support" x="295" y="24" fill="#ffffff" text-anchor="middle">Seven team groups</text>
      <rect x="410" width="205" height="36" rx="18" fill="#26334a"/><text class="support" x="512" y="24" fill="#ffffff" text-anchor="middle">Partner coordination</text>
      <rect x="635" width="413" height="36" rx="18" fill="#26334a"/><text class="support" x="841" y="24" fill="#ffffff" text-anchor="middle">Tracking and repeatable guidance</text>
    </g>
  </g>
</svg>
